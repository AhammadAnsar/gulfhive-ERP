<!doctype html>
<html lang="en">

    <script>
      // Ensure window.fetch accessor defined by iframe bridge is safe for reassignment
      (function() {
        var originalDefineProperty = Object.defineProperty;
        Object.defineProperty = function(obj, prop, descriptor) {
          if (obj === window && prop === 'fetch' && descriptor && descriptor.get && !descriptor.set) {
            var getter = descriptor.get;
            var customSetter = function(val) {
              getter = function() { return val; };
            };
            return originalDefineProperty.call(this, obj, prop, {
              get: function() { return getter(); },
              set: customSetter,
              configurable: true,
              enumerable: descriptor.enumerable !== undefined ? descriptor.enumerable : true,
            });
          }
          return originalDefineProperty.apply(this, arguments);
        };
      })();
    </script>
